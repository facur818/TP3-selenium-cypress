<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - App E2E Demo</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1f2937;
      --primary: #2563eb;
      --danger: #dc2626;
      --success: #166534;
      --border: #d1d5db;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #dbeafe 0%, var(--bg) 35%);
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 18px 35px rgba(30, 64, 175, 0.12);
    }
    h1 { margin-top: 0; }
    .group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .error {
      min-height: 18px;
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .status {
      min-height: 22px;
      margin: 8px 0 10px;
      font-weight: 600;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--danger); }
    .helper {
      margin-bottom: 14px;
      border: 1px dashed #bfdbfe;
      background: #eff6ff;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.92rem;
      color: #1e3a8a;
    }
    .helper strong {
      color: #1f2937;
    }
  </style>
</head>
<body>
  <main class="panel" data-testid="login-card">
    <h1>Login</h1>
    <div class="helper" data-testid="login-helper">
      Credenciales de prueba: usuario <strong>admin</strong> y contrasena <strong>1234</strong>.
    </div>
    <form id="loginForm" novalidate>
      <div class="group">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" data-testid="login-username" />
        <div id="usernameError" class="error" data-testid="login-username-error"></div>
      </div>

      <div class="group">
        <label for="password">Contrasena</label>
        <input id="password" name="password" type="password" data-testid="login-password" />
        <div id="passwordError" class="error" data-testid="login-password-error"></div>
      </div>

      <div id="statusMsg" class="status" data-testid="login-status"></div>
      <button type="submit" data-testid="login-submit">Iniciar sesion</button>
    </form>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
